[project]
name = "job-apply"
authors = [{name = "Pooria Soltani", email = "pooria.ms@gmail.com"}]
version = "0.2.0"
description = "Airtable-driven job application assistant: parses job ads, writes tailored cover letters & CV intros, answers form questions, drafts follow-up emails with an LLM, and compiles PDFs with Typst."
keywords = ["job-application", "cover-letter", "airtable", "llm", "pydantic-ai", "fastapi", "typst"]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "httpx2>=2.13.1",
    "pyairtable>=3.3.0",
    "pydantic>=2.13.4",
    "pydantic-ai-slim[anthropic,google,openai]>=2.57.0",
    "pydantic-settings>=2.14.1",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = ["devtools>=0.12.2", "ruff>=0.16.5", "ty>=0.0.78"]

[tool.ruff.lint]
extend-select = ["I", "RUF022"]
ignore = ["E501"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ty.rules]
all = "warn"

[project.scripts]
job-apply = "src.api.server:run"

[tool.setuptools.packages.find]
where = ["."]

[tool.uv]
package = true
